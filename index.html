<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mood Tracker 🌙</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d0f; color: #f0f0f5;
      font-family: 'DM Sans', sans-serif; min-height: 100vh;
      padding: 40px 20px 80px; display: flex; justify-content: center;
      background-image: radial-gradient(ellipse at 20% 20%, rgba(124,106,255,0.06) 0%, transparent 60%), radial-gradient(ellipse at 80% 80%, rgba(255,107,107,0.04) 0%, transparent 60%);
    }
    .container { width: 100%; max-width: 560px; }
    .tag { font-size: 11px; letter-spacing: 0.2em; color: #7c6aff; margin-bottom: 16px; opacity: 0.8; font-weight: 500; }
    h1 { font-family: 'Syne', sans-serif; font-size: clamp(36px,8vw,52px); font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; margin-bottom: 16px; }
    h1 span { color: #7c6aff; }
    .subtitle { font-size: 15px; color: #6b6b7a; font-weight: 300; line-height: 1.6; margin-bottom: 48px; }
    .mood-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 24px; }
    .mood-card { background: #141417; border: 1px solid #2a2a30; border-radius: 20px; padding: 24px 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 10px; transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1); outline: none; }
    .mood-card:hover { transform: translateY(-3px) scale(1.03); }
    .mood-emoji { font-size: 36px; transition: transform 0.2s; }
    .mood-card:hover .mood-emoji { transform: scale(1.15); }
    .mood-label { font-size: 13px; font-weight: 500; color: #6b6b7a; }
    .save-btn { width: 100%; padding: 18px 24px; border-radius: 16px; border: 1px solid #2a2a30; background: #141417; color: #6b6b7a; font-family: 'DM Sans',sans-serif; font-size: 15px; font-weight: 500; cursor: not-allowed; transition: all 0.3s; margin-bottom: 48px; }
    .save-btn.active { background: #7c6aff; border-color: #7c6aff; color: white; cursor: pointer; box-shadow: 0 8px 32px rgba(124,106,255,0.35); }
    .save-btn.active:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(124,106,255,0.45); }
    .history-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .history-header h2 { font-family: 'Syne',sans-serif; font-size: 22px; font-weight: 700; }
    .history-count { font-size: 12px; color: #6b6b7a; background: #1c1c21; padding: 4px 10px; border-radius: 20px; border: 1px solid #2a2a30; }
    .history-list { display: flex; flex-direction: column; gap: 8px; }
    .history-item { display: flex; align-items: center; gap: 16px; background: #141417; border: 1px solid #2a2a30; border-radius: 16px; padding: 16px 20px; animation: slideIn 0.3s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes slideIn { from { opacity:0; transform:translateY(-12px) scale(0.97); } to { opacity:1; transform:translateY(0) scale(1); } }
    .history-emoji { font-size: 28px; }
    .history-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .history-label { font-size: 15px; font-weight: 500; }
    .history-time { font-size: 12px; color: #6b6b7a; }
    .history-dot { width: 8px; height: 8px; border-radius: 50%; opacity: 0.6; }
    .toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%); background: #1c1c21; border: 1px solid #2a2a30; color: #f0f0f5; padding: 14px 28px; border-radius: 50px; font-size: 14px; font-weight: 500; z-index: 100; box-shadow: 0 8px 32px rgba(0,0,0,0.4); animation: toastIn 0.3s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(16px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
    @media (max-width:400px) { .mood-grid { grid-template-columns: repeat(2,1fr); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="tag">DAILY CHECK-IN</div>
    <h1>How are you<br><span>feeling today?</span></h1>
    <p class="subtitle">Track your emotional rhythm, one day at a time.</p>
    <div class="mood-grid" id="moodGrid"></div>
    <button class="save-btn" id="saveBtn" disabled>Select a mood first</button>
    <div id="historySection" style="display:none;">
      <div class="history-header">
        <h2>Your History</h2>
        <span class="history-count" id="historyCount">0 entries</span>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>
  <script>
    const MOODS = [
      { emoji:"😄", label:"Happy", color:"#FFD93D" },
      { emoji:"😌", label:"Calm", color:"#6BCB77" },
      { emoji:"😔", label:"Sad", color:"#4D96FF" },
      { emoji:"😠", label:"Angry", color:"#FF6B6B" },
      { emoji:"😰", label:"Anxious", color:"#FF922B" },
      { emoji:"🥳", label:"Excited", color:"#CC5DE8" },
    ];
    let selected = null;
    let history = [];
    const grid = document.getElementById('moodGrid');
    const saveBtn = document.getElementById('saveBtn');
    const historySection = document.getElementById('historySection');
    const historyList = document.getElementById('historyList');
    const historyCount = document.getElementById('historyCount');
    MOODS.forEach((mood, i) => {
      const card = document.createElement('button');
      card.className = 'mood-card';
      card.innerHTML = `<span class="mood-emoji">${mood.emoji}</span><span class="mood-label">${mood.label}</span>`;
      card.onclick = () => selectMood(i);
      grid.appendChild(card);
    });
    function selectMood(i) {
      selected = i;
      document.querySelectorAll('.mood-card').forEach((c, idx) => {
        const m = MOODS[idx];
        if (idx === i) {
          c.style.borderColor = m.color;
          c.style.background = m.color + '18';
          c.style.boxShadow = `0 12px 40px rgba(0,0,0,0.3), 0 0 0 1px ${m.color}`;
          c.style.transform = 'translateY(-4px) scale(1.04)';
          c.querySelector('.mood-label').style.color = m.color;
          c.querySelector('.mood-emoji').style.transform = 'scale(1.15)';
        } else {
          c.style.borderColor = '#2a2a30';
          c.style.background = '#141417';
          c.style.boxShadow = 'none';
          c.style.transform = 'none';
          c.querySelector('.mood-label').style.color = '#6b6b7a';
          c.querySelector('.mood-emoji').style.transform = 'scale(1)';
        }
      });
      saveBtn.classList.add('active');
      saveBtn.disabled = false;
      saveBtn.textContent = `Save "${MOODS[i].label}" Mood`;
    }
    function formatTime(date) {
      return date.toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
    }
    saveBtn.onclick = () => {
      if (selected === null) return;
      const mood = MOODS[selected];
      history.unshift({ mood, time: new Date() });
      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerHTML = `<span class="history-emoji">${mood.emoji}</span><div class="history-info"><span class="history-label" style="color:${mood.color}">${mood.label}</span><span class="history-time">${formatTime(new Date())}</span></div><div class="history-dot" style="background:${mood.color}"></div>`;
      historyList.prepend(item);
      historySection.style.display = 'block';
      historyCount.textContent = `${history.length} entries`;
      selected = null;
      document.querySelectorAll('.mood-card').forEach(c => {
        c.style.borderColor = '#2a2a30'; c.style.background = '#141417';
        c.style.boxShadow = 'none'; c.style.transform = 'none';
        c.querySelector('.mood-label').style.color = '#6b6b7a';
        c.querySelector('.mood-emoji').style.transform = 'scale(1)';
      });
      saveBtn.classList.remove('active');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Select a mood first';
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = 'Mood saved! 🎉';
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2000);
    };
  </script>
</body>
</html>
